name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @costco/web run build
        env:
          # Required so vite-plugin-pwa precaches without warnings.
          NODE_ENV: production
      # Catch any Worker-incompatible API change before merge (e.g. stray
      # `import 'node:crypto'`). Doesn't actually deploy — outdir is local.
      - name: Wrangler dry-run deploy (api)
        run: |
          pnpm --filter @costco/api exec wrangler deploy \
            --dry-run \
            --outdir .wrangler/dry-run
        env:
          # Wrangler reads vars from wrangler.jsonc; secrets aren't needed for
          # dry-run because nothing actually deploys.
          CLOUDFLARE_API_TOKEN: dry-run-no-token-needed
